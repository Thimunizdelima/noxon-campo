<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#33CCCC">
<title>Noxon Campo</title>
<style>
/* Layout: the paper spreadsheet, re-flowed for a phone — turquoise section bars, light-blue header cells, ruled boxes stacked in one column */
:root{
  --turq:#33CCCC; --sky:#99CCFF; --sky-soft:#E3F0FF; --yellow:#FFFF00; --yellow-soft:#FFFDB8;
  --ink:#111; --muted:#4a5560; --line:#111; --hair:#c9d3dc; --paper:#fff; --ground:#eef2f4;
  --brand:#004d47; --brand-red:#c0191f;
  --sheet:Verdana,Geneva,"DejaVu Sans",Tahoma,sans-serif;
  --cell:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--cell);font-size:15px;line-height:1.35}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* Top header */
.top{background:var(--paper);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 12px}
.top img{width:132px;height:auto;display:block}
.top h1{font-family:var(--sheet);font-size:14px;margin:0;letter-spacing:.02em;text-wrap:balance}
.top p{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* Tabs as sheet tabs */
.tabs{display:flex;gap:4px;margin-top:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:6px}
.tabs button{flex:1;border:1px solid var(--line);background:#dfe6ea;padding:10px 6px;font-family:var(--sheet);font-weight:700;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--turq)}

/* Identity block (Colaborador / Regional) */
.ident{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-bottom:0;margin-top:8px;background:var(--paper)}
.ident label{display:block;border-bottom:1px solid var(--line);padding:6px 8px;font-family:var(--sheet);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.ident label:nth-child(odd){border-right:1px solid var(--line)}
.ident label.full{grid-column:1/-1;border-right:0}
.ident input{display:block;width:100%;border:0;padding:4px 0 2px;font-family:var(--cell);font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;background:transparent}
.ident .k{background:var(--turq);margin:-6px -8px 4px;padding:4px 8px}

/* Section bar */
.bar{background:var(--turq);border:1px solid var(--line);font-family:var(--sheet);font-weight:700;font-size:14px;padding:8px 10px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar small{font-weight:400;font-size:12px}
.bar .lnk{border:0;background:none;padding:0;font-size:12px;text-decoration:underline}

/* Entry = a row of the sheet, drawn as label/value cells */
.entry{background:var(--paper);border:1px solid var(--line);border-top:0}
.cellrow{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--line)}
.cellrow:last-child{border-bottom:0}
.cellrow>.lab{background:var(--sky);font-family:var(--sheet);font-size:11px;font-weight:700;padding:8px 6px;border-right:1px solid var(--line);display:flex;align-items:center}
.cellrow>.val{min-width:0;padding:4px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cellrow.gestor>.lab{background:var(--yellow)}
.cellrow.gestor>.val{background:var(--yellow-soft)}
.val input,.val textarea{width:100%;border:0;background:transparent;padding:6px 2px;min-height:34px}
.val textarea{resize:vertical;min-height:40px;line-height:1.35}
.val input[type=date]{max-width:180px}
.entry-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:var(--sky-soft);border-bottom:1px solid var(--line);font-family:var(--sheet);font-size:11px;font-weight:700}
.entry-head button{border:1px solid var(--hair);background:var(--paper);font-size:12px;padding:3px 8px}

/* Pickers */
.pick{width:100%;text-align:left;border:1px dashed #7d8c99;background:#fbfdff;padding:7px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:38px}
.pick.filled{border-style:solid;border-color:var(--hair);background:var(--paper)}
.pick .ph{color:var(--muted)}
.pick .chev{font-size:12px;color:var(--muted);flex:none}
.val.stack{flex-direction:column;align-items:stretch;gap:2px}
.val.stack input{border-top:1px dotted var(--hair)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--sky-soft);border:1px solid var(--sky);font-size:12px;padding:2px 7px;border-radius:2px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;border-right:1px solid var(--line);background:var(--paper);padding:6px 12px;font-weight:700;font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--turq)}
.money{display:flex;align-items:center;gap:4px;width:100%}
.money span{color:var(--muted)}
.money input{font-variant-numeric:tabular-nums}

.add{display:block;width:100%;border:1px solid var(--line);border-top:0;background:var(--paper);padding:11px;font-weight:700;font-size:14px;color:var(--brand)}
.add:hover{background:var(--sky-soft)}

/* Summary */
.sum{background:var(--paper);border:1px solid var(--line);border-top:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.sum div{padding:10px;border-bottom:1px solid var(--line)}
.sum div:nth-child(odd){border-right:1px solid var(--line)}
.sum dt{font-family:var(--sheet);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.sum dd{margin:4px 0 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .wide{grid-column:1/-1;border-right:0!important;background:var(--sky-soft)}
.legend{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* Footer actions */
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.actions .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);padding:11px 8px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.wa{background:#25D366;border-color:#1a9e4b;color:#08311a}
.btn.ghost{font-weight:400;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Sheet (bottom drawer) */
.scrim{position:fixed;inset:0;background:rgba(0,20,30,.45);z-index:20}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--paper);z-index:21;border-top:3px solid var(--turq);display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.drawer header{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--hair)}
.drawer header h2{font-family:var(--sheet);font-size:14px;margin:0}
.drawer header button{border:0;background:none;font-size:14px;text-decoration:underline}
.drawer .search{padding:8px 16px}
.drawer .search input{width:100%;border:1px solid var(--line);padding:10px}
.drawer .list{overflow:auto;padding:0 16px 8px;flex:1}
.drawer .grp{background:var(--turq);font-family:var(--sheet);font-size:12px;font-weight:700;padding:6px 8px;margin-top:10px;border:1px solid var(--line);position:sticky;top:0}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border:1px solid var(--line);border-top:0;cursor:pointer;background:var(--paper)}
.opt input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.opt:has(input:checked){background:var(--sky-soft)}
.drawer footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 2fr;gap:8px}
.other{display:flex;gap:6px;padding:10px 8px;border:1px solid var(--line);border-top:0}
.other input{flex:1;min-width:0;border:1px solid var(--hair);padding:8px}

.confirm{background:var(--yellow-soft);border:1px solid var(--line);padding:10px;margin-top:12px;font-size:14px}
.confirm .row{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;font-size:13px;z-index:30;max-width:90%}
.note{font-size:12px;color:var(--muted);margin:10px 2px 0}
@media (max-width:380px){.cellrow{grid-template-columns:88px 1fr}.top img{width:104px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* ---- Painel ---- */
:root{--serie:#009c94;--serie-soft:rgba(0,156,148,.14);--good:#0a7f0a;--warn:#9a6a00;--crit:#c0262b}
.pf{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pf label{flex:1 1 140px;display:flex;flex-direction:column;gap:3px;font-family:var(--sheet);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.pf label[hidden]{display:none}
.pf select,.pf input{font-family:var(--cell);font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;border:1px solid var(--line);background:var(--paper);padding:9px 6px;width:100%;min-height:40px}
.bar small{font-family:var(--cell)}
.metaBox{background:var(--yellow-soft);border:1px solid var(--line);border-top:0;padding:10px 12px}
.metaIn{display:flex;flex-direction:column;gap:6px;font-family:var(--sheet);font-weight:700;font-size:13px;letter-spacing:.06em}
.metaIn small{font-weight:400;letter-spacing:0;text-transform:none;font-family:var(--cell);font-size:12px}
.money.big{background:var(--paper);border:2px solid var(--line);padding:4px 10px}
.money.big span{font-size:18px;font-family:var(--cell);letter-spacing:0}
.money.big input{font-size:24px;font-weight:700;border:0;width:100%;padding:6px 0;background:transparent;font-variant-numeric:tabular-nums;letter-spacing:0}
.metaHint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-top:0}
.kpis.small{margin-top:10px;border-top:1px solid var(--line)}
.kpi{padding:10px;border-bottom:1px solid var(--line);min-width:0}
.kpi:nth-child(odd):not(.wide){border-right:1px solid var(--line)}
.kpi.wide{grid-column:1/-1}
.kpi.wide + .kpi:not(.wide){border-right:1px solid var(--line)}
.kpi.wide + .kpi:not(.wide) + .kpi:not(.wide){border-right:0}
.kpi dt{font-family:var(--sheet);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi dd{margin:4px 0 0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpis .kpi.wide:first-child dd{font-size:30px}
.kpi small{color:var(--muted);font-size:12px}
.kpis.small dd{font-size:18px}
.prog .track{position:relative;height:16px;background:#e6ecef;border:1px solid var(--line)}
.prog .fill{position:absolute;inset:0 auto 0 0;background:var(--serie);border-radius:0 4px 4px 0}
.prog .exp{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.progLeg{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;gap:8px}
.stRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.st{font-size:13px;font-weight:700;padding:3px 8px;border:1px solid currentColor}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.crit{color:var(--crit)}.st.neutral{color:var(--muted)}
.perday{font-size:13px}
.chart{position:relative;background:var(--paper);border:1px solid var(--line);border-top:0;padding:8px 8px 4px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .grid{stroke:#e3e8eb;stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--cell)}
.chart .line{fill:none;stroke:var(--serie);stroke-width:2;stroke-linejoin:round}
.chart .area{fill:var(--serie-soft)}
.chart .end{fill:var(--serie);stroke:var(--paper);stroke-width:2}
.chart .metaLine{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 4}
.chart .metaLab{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--cell)}
.chart .cross{stroke:var(--muted);stroke-width:1}
.chart .legend{margin:2px 4px 4px}
.tip{position:absolute;top:8px;width:150px;background:var(--ink);color:#fff;font-size:12px;padding:6px 8px;pointer-events:none;line-height:1.4}
.rank{background:var(--paper);border:1px solid var(--line);border-top:0;padding:6px 8px}
.rk{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--hair)}
.rk:last-child{border-bottom:0}
.rkL{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkB{height:12px;background:#eef2f4}
.rkB i{display:block;height:100%;background:var(--serie);border-radius:0 4px 4px 0}
.rkV{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{background:var(--paper);border:1px solid var(--line);border-top:0;padding:12px;color:var(--muted);font-size:14px}
.tabs button{font-size:12.5px}
.recbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:8px}
.rb-l{flex:1 1 180px;display:flex;flex-direction:column;gap:3px;font-family:var(--sheet);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.rb-l select{font-family:var(--cell);font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;border:1px solid var(--line);background:var(--paper);padding:9px 6px;width:100%}
.rb-new{flex:none;padding:9px 14px}
.ro-note{background:var(--yellow-soft);border:1px solid var(--line);padding:8px 10px;font-size:13px;margin:8px 0 0}
#sync{font-size:11.5px;margin-top:4px;color:var(--muted)}
#sync[data-k=ok]::before{content:"● ";color:#1a9e4b}
#sync[data-k=wait]::before{content:"● ";color:#d79b00}
#sync[data-k=off]::before,#sync[data-k=err]::before{content:"● ";color:var(--brand-red)}
#sync[data-k=err]{color:var(--brand-red)}
.auth{background:var(--paper);border:1px solid var(--line);margin-top:14px}
.auth h2{background:var(--turq);margin:0;font-family:var(--sheet);font-size:14px;padding:9px 12px;border-bottom:1px solid var(--line)}
.auth form,.auth .body{padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.auth label{display:flex;flex-direction:column;gap:4px;font-family:var(--sheet);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.auth input{border:1px solid var(--line);padding:11px 9px;font-family:var(--cell);font-size:16px;text-transform:none;letter-spacing:0;font-weight:400}
.auth .lnk{border:0;background:none;padding:4px 0;text-decoration:underline;color:var(--brand);text-align:left;font-size:14px}
.auth .msg{font-size:14px;min-height:1em;margin:0}
input:disabled,textarea:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
button:disabled{cursor:default}
</style>
</head><body>

let Q={up:{planejamentos:{},relatorios:{},visitas_planejadas:{},acoes_realizadas:{}},del:{visitas_planejadas:[],acoes_realizadas:[]},gcom:{}};
try{const q=JSON.parse(localStorage.getItem(KEY+":fila")||"null");if(q&&q.up)Q=q}catch(e){}
const saveQ=()=>{try{localStorage.setItem(KEY+":fila",JSON.stringify(Q))}catch(e){}};
const pending=()=>Object.values(Q.up).some(o=>Object.keys(o).length)||Object.values(Q.del).some(a=>a.length)||Object.keys(Q.gcom).length;
let flushT,flushing=false;
function setStatus(kind,msg){const el=$("#sync");if(!el)return;el.dataset.k=kind;el.textContent=msg}
function schedule(){saveQ();setStatus("wait",navigator.onLine?"Salvando…":"Sem conexão · salvo no aparelho");clearTimeout(flushT);flushT=setTimeout(flush,700)}
const nz=v=>v===""||v==null?null:v;
const money=v=>{const n=num(v);return n?Math.round(n*100)/100:null};
function qPlan(){if(readOnly()||!S.planId)return;Q.up.planejamentos[S.planId]={id:S.planId,vendedor_id:S.owner,periodo:S.periodo||"",regional:S.regional||""};schedule()}
function qRel(){
  if(!S.relId)return;
  if(readOnly()){if(isGestor()){Q.gcom["relatorios:"+S.relId]={table:"relatorios",id:S.relId,comentario_gestor:S.gestorGeral||""};schedule()}return}
  const a=S.ativ,p={id:S.relId,vendedor_id:S.owner,mes:S.mes||"",regiao:S.regiao||""};
  ["cafe","campo"].forEach(k=>["qtd","custo","tema","cliente","local"].forEach(f=>p[k+"_"+f]=a[k][f]||""));
  if(isGestor())p.comentario_gestor=S.gestorGeral||"";
  Q.up.relatorios[S.relId]=p;schedule();
}
function qVisit(wi,ri){
  if(readOnly())return;const r=S.weeks[wi][ri];
  Q.up.visitas_planejadas[r.id]={id:r.id,planejamento_id:S.planId,vendedor_id:S.owner,semana:wi+1,ordem:ri,data:nz(r.data),cliente:r.cliente||"",cidade:r.cidade||"",objetivos:r.objs||[],detalhe:r.objetivo||"",observacao:r.obs||""};
  schedule();
}
function qAcao(ri){
  const r=S.rows[ri];
  if(readOnly()){if(isGestor()){Q.gcom["acoes_realizadas:"+r.id]={table:"acoes_realizadas",id:r.id,comentario_gestor:r.gestor||""};schedule()}return}
  const p={id:r.id,relatorio_id:S.relId,vendedor_id:S.owner,ordem:ri,data:nz(r.data),tipo_visita:r.visita||"revenda",revenda:r.revenda||"",propriedade:r.propriedade||"",cidade:r.cidade||"",uf:ufOf(r.cidade),atividades:r.ativs||[],detalhe:r.atividade||"",produtos:r.produtos||[],valor:money(r.valor),venda_tipo:nz(r.tipo)};
  if(isGestor())p.comentario_gestor=r.gestor||"";
  Q.up.acoes_realizadas[r.id]=p;schedule();
}
function qDel(table,id){delete Q.up[table][id];Q.del[table].push(id);schedule()}
function qAllVisits(){S.weeks.forEach((w,wi)=>w.forEach((r,ri)=>qVisit(wi,ri)))}
function qAllAcoes(){S.rows.forEach((r,ri)=>qAcao(ri))}

async function flush(){
  if(flushing||!pending())return pending()?0:setStatus("ok","Tudo salvo");
  if(!navigator.onLine){setStatus("off","Sem conexão · salvo no aparelho");return}
  flushing=true;setStatus("wait","Salvando…");
  try{
    for(const t of ["planejamentos","relatorios","visitas_planejadas","acoes_realizadas"]){
      const rows=Object.values(Q.up[t]);if(!rows.length)continue;
      const {error}=await sb.from(t).upsert(rows);if(error)throw error;
      rows.forEach(r=>{if(Q.up[t][r.id]===r)delete Q.up[t][r.id]});saveQ();
    }
    for(const t of ["visitas_planejadas","acoes_realizadas"]){
      const ids=[...Q.del[t]];if(!ids.length)continue;
      const {error}=await sb.from(t).delete().in("id",ids);if(error)throw error;
      Q.del[t]=Q.del[t].filter(x=>!ids.includes(x));saveQ();
    }
    for(const [k,g] of Object.entries(Q.gcom)){
      const {error}=await sb.from(g.table).update({comentario_gestor:g.comentario_gestor}).eq("id",g.id);if(error)throw error;
      if(Q.gcom[k]===g)delete Q.gcom[k];saveQ();
    }
    setStatus("ok","Tudo salvo");
  }catch(e){console.error(e);setStatus("err","Não foi possível salvar: "+(e.message||e)+". Tentaremos de novo.");clearTimeout(flushT);flushT=setTimeout(flush,15000)}
  finally{flushing=false;if(pending()){clearTimeout(flushT);flushT=setTimeout(flush,700)}}
}
window.addEventListener("online",()=>flush());
window.addEventListener("offline",()=>setStatus("off","Sem conexão · salvo no aparelho"));

/* ---------- Catálogos vindos da API (com cópia local) ---------- */
function groupBy(rows,key,map){const m=new Map();rows.forEach(r=>{if(!m.has(r[key]))m.set(r[key],[]);m.get(r[key]).push(map(r))});return [...m.entries()]}
let UF_MAP={};
function applyCatalogs(c){
  CATALOGO=groupBy(c.produtos,"categoria",r=>[r.nome,r.descricao||""]);
  OBJETIVOS=groupBy(c.objetivos,"grupo",r=>[r.nome,r.descricao||""]);
  CLIENTES=groupBy(c.clientes,"rede",r=>[r.nome,r.cidade||"",r.info||""]);
  UF_MAP={};c.clientes.forEach(r=>{if(r.cidade)UF_MAP[r.cidade]=r.uf});
}
async function loadCatalogs(){
  try{const c=JSON.parse(localStorage.getItem(KEY+":cat")||"null");if(c)applyCatalogs(c)}catch(e){}
  const q=t=>sb.from(t).select("*").eq("ativo",true).order("ordem");
  const [p,o,c]=await Promise.all([q("produtos"),q("objetivos"),q("clientes")]);
  if(p.error||o.error||c.error)return;
  const cat={produtos:p.data,objetivos:o.data,clientes:c.data};applyCatalogs(cat);
  try{localStorage.setItem(KEY+":cat",JSON.stringify(cat))}catch(e){}
}

/* ---------- Carregar registros ---------- */
async function loadOwner(ownerId){
  await flush();
  S.owner=ownerId;
  const v=vendedores.find(x=>x.id===ownerId)||me;S.colab=v.nome||v.email||"";
  const [p,r]=await Promise.all([
    sb.from("planejamentos").select("id,periodo,regional,criado_em").eq("vendedor_id",ownerId).order("criado_em",{ascending:false}),
    sb.from("relatorios").select("*").eq("vendedor_id",ownerId).order("criado_em",{ascending:false})]);
  planos=p.data||[];rels=r.data||[];
  if(!planos.length&&!readOnly())planos=[await newPlan()];
  if(!rels.length&&!readOnly())rels=[await newRel()];
  await Promise.all([openPlan(planos[0]&&planos[0].id),openRel(rels[0]&&rels[0].id)]);
  render();
}
async function newPlan(){const row={id:uid(),vendedor_id:me.id,periodo:"",regional:me.regional||""};const {data,error}=await sb.from("planejamentos").insert(row).select().single();if(error){toast("Erro ao criar planejamento: "+error.message);return row}return data}
async function newRel(){const row={id:uid(),vendedor_id:me.id,mes:"",regiao:me.regional||""};const {data,error}=await sb.from("relatorios").insert(row).select().single();if(error){toast("Erro ao criar relatório: "+error.message);return row}return data}
async function openPlan(id){
  S.weeks=[[],[],[],[],[]];S.planId=id||null;const p=planos.find(x=>x.id===id);S.periodo=p?p.periodo:"";S.regional=p?p.regional:"";
  if(!id)return;
  const {data}=await sb.from("visitas_planejadas").select("*").eq("planejamento_id",id).order("semana").order("ordem");
  (data||[]).forEach(v=>S.weeks[v.semana-1].push({id:v.id,data:v.data||"",cliente:v.cliente||"",cidade:v.cidade||"",objs:v.objetivos||[],objetivo:v.detalhe||"",obs:v.observacao||""}));
}
async function openRel(id){
  S.rows=[];S.relId=id||null;S.ativ=emptyAtiv();const r=rels.find(x=>x.id===id);
  S.mes=r?r.mes:"";S.regiao=r?r.regiao:"";S.gestorGeral=r?r.comentario_gestor||"":"";
  if(r)["cafe","campo"].forEach(k=>["qtd","custo","tema","cliente","local"].forEach(f=>S.ativ[k][f]=r[k+"_"+f]||""));
  if(!id)return;
  const {data}=await sb.from("acoes_realizadas").select("*").eq("relatorio_id",id).order("ordem");
  S.rows=(data||[]).map(a=>({id:a.id,data:a.data||"",revenda:a.revenda||"",cidade:a.cidade||"",propriedade:a.propriedade||"",ativs:a.atividades||[],atividade:a.detalhe||"",produtos:a.produtos||[],valor:a.valor==null?"":String(a.valor).replace(".",","),tipo:a.venda_tipo||"",visita:a.tipo_visita||"revenda",gestor:a.comentario_gestor||""}));
}

function recordBar(){
  const isPlan=tab==="plan",list=isPlan?planos:rels,cur=isPlan?S.planId:S.relId;
  const lab=x=>isPlan?(x.periodo||"Planejamento sem período")+" · criado "+new Date(x.criado_em).toLocaleDateString("pt-BR"):(x.mes||"Relatório sem mês")+" · criado "+new Date(x.criado_em).toLocaleDateString("pt-BR");

  const t={valor:0,campo:0,revenda:0,pt:0,prods:{}};

/* ---------- Drawers ---------- */
function drawer(title,bodyHtml,footHtml){
  const host=$("#drawerHost");
  host.innerHTML=`<div class="scrim"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
   <header><h2>${esc(title)}</h2><button data-x>Fechar</button></header>
   <div class="search"><input id="dSearch" type="search" placeholder="Buscar…" autocomplete="off"></div>
   <div class="list" id="dList">${bodyHtml}</div>${footHtml||""}</div>`;
  const close=()=>{host.innerHTML="";document.body.style.overflow=""};
  document.body.style.overflow="hidden";
  host.querySelector(".scrim").onclick=close;host.querySelector("[data-x]").onclick=close;
  const s=$("#dSearch");
  s.oninput=()=>{const q=s.value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    host.querySelectorAll(".grp-wrap").forEach(g=>{let any=0;g.querySelectorAll(".opt").forEach(o=>{const hit=!q||o.dataset.s.includes(q);o.hidden=!hit;if(hit)any=1});g.hidden=!any})};
  document.addEventListener("keydown",function k(ev){if(ev.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  return {host,close};
}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

  let body="";
  CLIENTES.forEach(([g,list],gi)=>{
    body+=`<div class="grp-wrap"><div class="grp">${esc(g)}</div>`+list.map(([c,cid,info],i)=>{
      const on=cur&&cur.cliente===c&&(cur.cidade||"")===cid;
      return `<label class="opt" data-s="${esc(norm(c+" "+cid+" "+(info||"")+" "+g))}"><input type="radio" name="cli" value="${gi}:${i}" ${on?"checked":""}><span><b>${esc(c)}</b><small>${esc(cid?cid+" – "+ufOf(cid):"")}${info?(cid?" · ":"")+esc(info):""}</small></span></label>`}).join("")+`</div>`;
  });

  const {host,close}=drawer("Cliente / Local",body,`<footer><button class="btn" data-x2>Limpar</button><button class="btn pri" data-ok>Confirmar</button></footer>`);
  host.querySelectorAll('input[name=cli]').forEach(r=>r.onchange=()=>{const[gi,i]=r.value.split(":");const[c,cid]=CLIENTES[gi][1][i];onPick({c,cid});close()});
  host.querySelector("[data-ok]").onclick=()=>{const c=$("#otherCli").value.trim();if(c){onPick({c,cid:$("#otherCid").value.trim()})}close()};
  host.querySelector("[data-x2]").onclick=()=>{onPick({c:"",cid:""});close()};
}
function openChecklist(title,GROUPS,sel,onDone){
  const set=new Set(sel);let body="";
  GROUPS.forEach(([g,list])=>{
    body+=`<div class="grp-wrap"><div class="grp">${esc(g)}</div>`+list.map(([p,desc])=>`<label class="opt" data-s="${esc(norm(p+" "+desc+" "+g))}"><input type="checkbox" value="${esc(p)}" ${set.has(p)?"checked":""}><span><b>${esc(p)}</b><small>${esc(desc)}</small></span></label>`).join("")+`</div>`;
  });
  const {host,close}=drawer(title,body,`<footer><button class="btn" data-x2>Limpar</button><button class="btn pri" data-ok>Confirmar (<span id="pc">${set.size}</span>)</button></footer>`);
  host.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{c.checked?set.add(c.value):set.delete(c.value);$("#pc").textContent=set.size});

   DP.acoes(ini,fim,vend) -> [{data,valor,venda_tipo,tipo_visita,revenda,cidade,produtos[],atividades[],vendedor_id,vendedor_nome}]

   DP.vendedores() -> [{id,nome}] (vazio = sem filtro de vendedor) ; DP.podeEditarMeta(vend) -> bool */
const GRANS=[["diario","Diário"],["semanal","Semanal"],["quinzenal","Quinzenal"],["mensal","Mensal"],["bimestral","Bimestral"],["trimestral","Trimestral"],["semestral","Semestral"],["anual","Anual"]];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const lastOfMonth=(y,m)=>new Date(y,m+1,0);
const dm=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1);
function periodOf(gran,ref){
  const y=ref.getFullYear(),m=ref.getMonth();let a,b,label;
  if(gran==="diario"){a=b=ref;label=ref.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
  else if(gran==="semanal"){const wd=(ref.getDay()+6)%7;a=addDays(ref,-wd);b=addDays(a,6);label="Semana de "+dm(a)+" a "+dm(b)}
  else if(gran==="quinzenal"){if(ref.getDate()<=15){a=new Date(y,m,1);b=new Date(y,m,15);label="1ª quinzena de "+MESES[m]+"/"+y}else{a=new Date(y,m,16);b=lastOfMonth(y,m);label="2ª quinzena de "+MESES[m]+"/"+y}}
  else{const span={mensal:1,bimestral:2,trimestral:3,semestral:6,anual:12}[gran];const m0=m-(m%span);a=new Date(y,m0,1);b=lastOfMonth(y,m0+span-1);
    const nome={mensal:MESES[m0]+"/"+y,bimestral:(m0/2+1)+"º bimestre/"+y,trimestral:(m0/3+1)+"º trimestre/"+y,semestral:(m0/6+1)+"º semestre/"+y,anual:"Ano de "+y}[gran];label=nome.charAt(0).toUpperCase()+nome.slice(1)}
  return {ini:iso(a),fim:iso(b),label,a,b};
}
function bucketsOf(p,gran){
  const out=[];
  if(gran==="semestral"||gran==="anual"){let d=new Date(p.a.getFullYear(),p.a.getMonth(),1);while(d<=p.b){const e=lastOfMonth(d.getFullYear(),d.getMonth());out.push({ini:iso(d),fim:iso(e),lab:MESES[d.getMonth()].slice(0,3)});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  else{let d=new Date(p.a);while(d<=p.b){out.push({ini:iso(d),fim:iso(d),lab:dm(d)});d=addDays(d,1)}}
  return out;
}

function paceInfo(p){
  const hoje=parseISO(iso(new Date()));const tot=Math.round((p.b-p.a)/864e5)+1;
  let dec=Math.round((hoje-p.a)/864e5)+1;dec=Math.max(0,Math.min(tot,dec));
  return {tot,dec,rest:tot-dec+(dec>0&&dec<=tot&&hoje<=p.b?1:0),esperado:dec/tot};
}

  const cntF=v=>v===1?"1 ação":v+" ações";
  if(DP.vendedores().length&&!PF.vend)h+=rank("Vendas por vendedor",sumBy(a=>a.vendedor_nome||"—",a=>+a.valor||0).slice(0,12),brl);
  h+=rank("Vendas por revenda / cliente",sumBy(a=>a.revenda?(a.revenda+(a.cidade?" / "+a.cidade:"")):"",a=>+a.valor||0).filter(r=>r[1]>0).slice(0,10),brl);
  h+=rank("Produtos mais trabalhados",sumBy(a=>a.produtos||[],()=>1).slice(0,10),cntF,"nº de ações que citaram o produto");
  h+=rank("Atividades realizadas",sumBy(a=>a.atividades||[],()=>1).slice(0,10),cntF);
  const tipos=[["C","Cliente (C)"],["B","Balcão (B)"],["PT","Pedido transferido (PT)"]].map(([k,l])=>[l,acoes.filter(a=>a.venda_tipo===k).reduce((s,a)=>s+(+a.valor||0),0)]).filter(r=>r[1]>0);
  h+=rank("Vendas por tipo",tipos,brl);
  $("#pBody").innerHTML=h;
  if(PF.gran!=="diario")drawCum();
}
function drawCum(){
  const host=$("#cumChart");if(!host)return;const {acoes,p}=PD;const meta=PD.meta;
  const bs=bucketsOf(p,PF.gran);let acc=0;const hoje=iso(new Date());
  const pts=bs.map(b=>{const v=acoes.filter(a=>a.data>=b.ini&&a.data<=b.fim).reduce((s,a)=>s+(+a.valor||0),0);acc+=v;return {lab:b.lab,v,acc,fut:b.ini>hoje}});
  const W=Math.max(300,Math.round(host.clientWidth-16)),H=220,L=58,R=12,T=18,B=26;
  const maxY=Math.max(acc,meta||0,1)*1.08;
  const step=(()=>{const raw=maxY/4,p10=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].map(m=>m*p10).find(s=>s>=raw)})();
  const x=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1)),y=v=>T+(H-T-B)*(1-v/(step*Math.ceil(maxY/step)));
  const top=step*Math.ceil(maxY/step);
  let g="";for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v>=1000?(v/1000).toLocaleString("pt-BR")+" mil":v}</text>`;
  const every=Math.ceil(pts.length/Math.max(3,Math.floor((W-L-R)/58)));const last=pts.length-1;
  pts.forEach((pt,i)=>{if((i%every===0&&(i===last||last-i>=every*0.6))||i===last)g+=`<text x="${x(i)}" y="${H-8}" class="ax" text-anchor="${i===last&&last>0?"end":i===0&&last>0?"start":"middle"}">${pt.lab}</text>`});
  const real=pts.filter(pt=>!pt.fut);
  const path=real.map((pt,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(pt.acc).toFixed(1)).join("");
  const area=real.length?path+`L${x(real.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`:"";
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vendas acumuladas no período${meta>0?" comparadas à meta de "+brl(meta):""}">${g}`;
  if(meta>0)svg+=`<line x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}" class="metaLine"/><text x="${W-R}" y="${y(meta)-6}" text-anchor="end" class="metaLab">Meta ${brl(meta)}</text>`;
  if(real.length)svg+=`<path d="${area}" class="area"/><path d="${path}" class="line"/><circle cx="${x(real.length-1)}" cy="${y(real[real.length-1].acc)}" r="4.5" class="end"/>`;
  svg+=`<line id="cx" class="cross" y1="${T}" y2="${H-B}" x1="-10" x2="-10"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  host.innerHTML=svg+`<p class="legend">Linha: total vendido acumulado${meta>0?" · tracejado: meta":""}.</p>`;
  const s=host.querySelector("svg"),tip=host.querySelector("#tip"),cx=host.querySelector("#cx");
  const move=ev=>{const r=s.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let i=Math.round((px-L)/((W-L-R)/Math.max(pts.length-1,1)));i=Math.max(0,Math.min(pts.length-1,i));const pt=pts[i];
    cx.setAttribute("x1",x(i));cx.setAttribute("x2",x(i));tip.hidden=false;
    tip.innerHTML=`<b>${pt.lab}</b><br>No dia/mês: ${brl(pt.v)}<br>Acumulado: ${pt.fut?"—":brl(pt.acc)}${meta>0&&!pt.fut?`<br>${Math.round(pt.acc/meta*100)}% da meta`:""}`;
    const left=x(i)/W*r.width;tip.style.left=Math.min(Math.max(left-70,0),r.width-150)+"px"};
  s.addEventListener("pointermove",move);s.addEventListener("pointerdown",move);s.addEventListener("pointerleave",()=>{tip.hidden=true;cx.setAttribute("x1",-10);cx.setAttribute("x2",-10)});
}
async function openPainel(host){
  renderPainelShell(host,DP.vendedores());
  host.onchange=e=>{const t=e.target;
    if(t.id==="pfGran"){PF.gran=t.value;renderPainelShell(host,DP.vendedores());loadPainel()}
    else if(t.id==="pfMes"){if(!t.value)return;PF.mes=t.value;PF.dia=t.value+"-01";renderPainelShell(host,DP.vendedores());loadPainel()}
    else if(t.id==="pfDia"){PF.dia=t.value;loadPainel()}
    else if(t.id==="pfVend"){PF.vend=t.value;loadPainel()}};
  host.oninput=e=>{if(e.target.id!=="metaVal")return;
    const raw=e.target.value.trim();const v=raw===""?null:num(raw);PD.meta=v;renderPainelBody();
    clearTimeout(metaT);const p=PD.p,gran=PF.gran,vend=PF.vend||null;
    metaT=setTimeout(async()=>{try{await DP.setMeta(vend,gran,p.ini,p.fim,v);toast(v==null?"Meta removida":"Meta salva")}catch(err){toast("Não foi possível salvar a meta: "+(err.message||err))}},800)};
  await loadPainel();
}

/* ---------- Provedor de dados do Painel (API Supabase) ---------- */
const DP={
  async acoes(ini,fim,vend){
    if(!isGestor())vend=me.id;
    let q=sb.from("v_acoes").select("data,valor,venda_tipo,tipo_visita,revenda,cidade,produtos,atividades,vendedor_id,vendedor_nome").gte("data",ini).lte("data",fim);
    if(vend)q=q.eq("vendedor_id",vend);
    const {data,error}=await q;if(error){toast("Erro ao carregar vendas: "+error.message);return[]}return data||[];
  },
  async visitas(ini,fim,vend){
    if(!isGestor())vend=me.id;
    let q=sb.from("visitas_planejadas").select("data,vendedor_id").gte("data",ini).lte("data",fim);
    if(vend)q=q.eq("vendedor_id",vend);
    const {data}=await q;return data||[];
  },
  async getMeta(vend,gran,ini){
    if(!isGestor())vend=me.id;
    let q=sb.from("metas").select("id,valor").eq("granularidade",gran).eq("inicio",ini);
    q=vend?q.eq("vendedor_id",vend):q.is("vendedor_id",null);
    const {data}=await q;const m=(data||[])[0];return m?+m.valor:null;
  },
  async setMeta(vend,gran,ini,fim,valor){
    if(!isGestor())vend=me.id;
    let q=sb.from("metas").select("id").eq("granularidade",gran).eq("inicio",ini);
    q=vend?q.eq("vendedor_id",vend):q.is("vendedor_id",null);
    const {data,error:e1}=await q;if(e1)throw e1;const ex=(data||[])[0];
    let r;
    if(valor==null){if(ex)r=await sb.from("metas").delete().eq("id",ex.id)}
    else if(ex)r=await sb.from("metas").update({valor,fim}).eq("id",ex.id);
    else r=await sb.from("metas").insert({vendedor_id:vend,granularidade:gran,inicio:ini,fim,valor});
    if(r&&r.error)throw r.error;
  },
  vendedores(){return isGestor()?vendedores.map(v=>({id:v.id,nome:v.nome||v.email})):[]},
  podeEditarMeta(vend){return isGestor()||true}
};

/* ---------- Render geral ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  $("#view-plan").hidden=tab!=="plan";$("#view-real").hidden=tab!=="real";$("#view-painel").hidden=tab!=="painel";
  $(".actions").hidden=tab==="painel";$("#recHost").hidden=tab==="painel";$("#appNote").hidden=tab==="painel";
  if(tab==="painel"){$("#docTitle").textContent="PAINEL DE AVALIAÇÃO";$("#docSub").textContent=isGestor()?"Equipe de campo":(me.nome||"");openPainel($("#view-painel"));return}
  $("#docTitle").textContent=tab==="plan"?"PLANEJAMENTO SEMANAL":"COMUNICADO SEMANAL DE AÇÕES";
  $("#docSub").textContent=(S.colab?S.colab+" · ":"")+(tab==="plan"?(S.periodo||"período a definir"):(S.mes||"mês a definir"));
  $("#recHost").innerHTML=recordBar();
  tab==="plan"?renderPlan():renderReal();
  if(readOnly()){
    document.querySelectorAll("#view-plan input,#view-plan textarea,#view-plan button,#view-real input,#view-real textarea,#view-real button").forEach(el=>{
      const g=el.dataset.real&&el.dataset.real.endsWith(",gestor")||el.dataset.f==="gestorGeral";
      if(!g)el.disabled=true;
    });
    document.querySelectorAll(".add,.entry-head button").forEach(el=>el.hidden=true);
  }else if(!isGestor()){
    document.querySelectorAll('[data-f="gestorGeral"],[data-real$=",gestor"]').forEach(el=>{el.disabled=true;el.placeholder="Preenchido pelo gestor"});
  }
  updateWa();
}

/* ---------- Edição ---------- */
document.addEventListener("input",e=>{
  const el=e.target,ds=el.dataset;
  if(ds.f){S[ds.f]=el.value;
    if(ds.f==="periodo"||ds.f==="regional"){qPlan();const p=planos.find(x=>x.id===S.planId);if(p){p.periodo=S.periodo;p.regional=S.regional}}
    else if(ds.f==="mes"||ds.f==="regiao"||ds.f==="gestorGeral"){qRel();const r=rels.find(x=>x.id===S.relId);if(r){r.mes=S.mes;r.regiao=S.regiao;r.comentario_gestor=S.gestorGeral}}
    $("#docSub").textContent=(S.colab?S.colab+" · ":"")+(tab==="plan"?(S.periodo||"período a definir"):(S.mes||"mês a definir"));}
  else if(ds.plan){const[w,r,f]=ds.plan.split(",");S.weeks[w][r][f]=el.value;qVisit(+w,+r)}
  else if(ds.real){const[r,f]=ds.real.split(",");S.rows[r][f]=el.value;qAcao(+r);if(f==="valor")renderSum()}
  else if(ds.ativ){const[k,f]=ds.ativ.split(",");S.ativ[k][f]=el.value;qRel()}
  else return;
  updateWa();
});
document.addEventListener("change",async e=>{
  if(e.target.id==="selVend"){await loadOwner(e.target.value)}
  else if(e.target.id==="selRec"){await flush();if(tab==="plan")await openPlan(e.target.value);else await openRel(e.target.value);render()}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act],[data-tab]");if(!b||b.disabled)return;
  if(b.dataset.tab){tab=b.dataset.tab;try{localStorage.setItem(KEY+":tab",tab)}catch(e){}render();window.scrollTo({top:0});return}
  const a=b.dataset.act,ds=b.dataset;
  if(a==="newRec"){await flush();if(tab==="plan"){const p=await newPlan();planos.unshift(p);await openPlan(p.id)}else{const r=await newRel();rels.unshift(r);await openRel(r.id)}render();toast(tab==="plan"?"Novo planejamento criado":"Novo relatório criado");return}
  if(readOnly()&&!["logout"].includes(a))return;
  if(a==="addPlan"){const wk=S.weeks[ds.w];const last=wk[wk.length-1];wk.push({id:uid(),data:last?last.data:"",cliente:"",cidade:"",objs:[],objetivo:"",obs:""});qVisit(+ds.w,wk.length-1);commit()}
  else if(a==="delPlan"){const r=S.weeks[ds.w].splice(ds.r,1)[0];qDel("visitas_planejadas",r.id);S.weeks[ds.w].forEach((x,i)=>qVisit(+ds.w,i));commit()}
  else if(a==="addReal"){const last=S.rows[S.rows.length-1];S.rows.push({id:uid(),data:last?last.data:new Date().toISOString().slice(0,10),revenda:"",cidade:"",propriedade:"",ativs:[],atividade:"",produtos:[],valor:"",tipo:"",visita:"revenda",gestor:""});qAcao(S.rows.length-1);commit()}
  else if(a==="delReal"){const r=S.rows.splice(ds.r,1)[0];qDel("acoes_realizadas",r.id);qAllAcoes();commit()}
  else if(a==="visita"){S.rows[ds.r].visita=ds.v;qAcao(+ds.r);commit()}
  else if(a==="tipo"){const r=S.rows[ds.r];r.tipo=r.tipo===ds.v?"":ds.v;qAcao(+ds.r);commit()}
  else if(a==="planCli")openClients(sel=>{const r=S.weeks[ds.a][ds.b];r.cliente=sel.c;r.cidade=sel.cid;qVisit(+ds.a,+ds.b);commit()},S.weeks[ds.a][ds.b]);
  else if(a==="realCli")openClients(sel=>{const r=S.rows[ds.a];r.revenda=sel.c;if(sel.cid||!r.cidade)r.cidade=sel.cid;qAcao(+ds.a);commit()},{cliente:S.rows[ds.a].revenda,cidade:S.rows[ds.a].cidade});
  else if(a==="prod")openChecklist("Produtos Noxon",CATALOGO,S.rows[ds.a].produtos,list=>{S.rows[ds.a].produtos=list;qAcao(+ds.a);commit()});
  else if(a==="objs")openChecklist("Objetivos da visita",OBJETIVOS,S.weeks[ds.a][ds.b].objs,list=>{S.weeks[ds.a][ds.b].objs=list;qVisit(+ds.a,+ds.b);commit()});
  else if(a==="ativs")openChecklist("Atividades realizadas",OBJETIVOS,S.rows[ds.a].ativs,list=>{S.rows[ds.a].ativs=list;qAcao(+ds.a);commit()});
});
function commit(){const y=window.scrollY;render();window.scrollTo({top:y})}

/* ---------- Login ---------- */
function show(id){["login","wait","app"].forEach(x=>$("#"+x).hidden=x!==id);$(".actions").hidden=id!=="app"}
let mode="in";
function loginView(){
  $("#lgTitle").textContent=mode==="in"?"Entrar":"Criar conta";
  $("#lgNomeRow").hidden=mode==="in";
  $("#lgBtn").textContent=mode==="in"?"Entrar":"Criar conta";
  $("#lgSwitch").textContent=mode==="in"?"Ainda não tem conta? Criar conta":"Já tenho conta. Entrar";
}
$("#lgSwitch").onclick=()=>{mode=mode==="in"?"up":"in";$("#lgMsg").textContent="";loginView()};
$("#lgForm").addEventListener("submit",async e=>{
  e.preventDefault();const email=$("#lgEmail").value.trim(),password=$("#lgPass").value,msg=$("#lgMsg");
  msg.textContent="Aguarde…";$("#lgBtn").disabled=true;
  try{
    if(mode==="in"){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;msg.textContent="";await boot()}
    else{const nome=$("#lgNome").value.trim();if(!nome)throw new Error("Informe seu nome.");
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{nome},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
      if(data.session){await boot()}else{msg.textContent="Conta criada. Abra o e-mail de confirmação que enviamos e depois entre aqui. O gestor precisa liberar seu acesso."}}
  }catch(err){msg.textContent=traduz(err.message||String(err))}
  finally{$("#lgBtn").disabled=false}
});
function traduz(m){
  if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/Email not confirmed/i.test(m))return"Confirme seu e-mail pelo link que enviamos antes de entrar.";
  if(/at least 6/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(/already registered/i.test(m))return"Este e-mail já tem conta. Use Entrar.";
  return m;
}
$("#waitOut").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("#waitRetry").onclick=()=>boot();

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show("login");loginView();return}
  const {data:p,error}=await sb.from("perfis").select("*").eq("id",session.user.id).single();
  if(error||!p){show("wait");$("#waitMsg").textContent="Não encontramos seu perfil. Fale com o gestor.";return}
  me=p;
  if(p.papel==="pendente"){show("wait");$("#waitMsg").textContent=`Olá, ${p.nome||p.email}. Seu acesso ainda não foi liberado pelo gestor. Assim que ele liberar, toque em "Verificar de novo".`;return}
  show("app");setStatus("wait","Carregando…");
  await loadCatalogs();
  vendedores=[me];
  if(isGestor()){const {data}=await sb.from("perfis").select("id,nome,email,papel,regional").in("papel",["vendedor","gestor"]).order("nome");vendedores=data||[me]}
  let start=me.id;try{const s=localStorage.getItem(KEY+":owner");if(s&&vendedores.some(v=>v.id===s))start=s}catch(e){}
  await loadOwner(start);
  flush();
}
document.addEventListener("change",e=>{if(e.target.id==="selVend")try{localStorage.setItem(KEY+":owner",e.target.value)}catch(_){}});
boot();

})();
